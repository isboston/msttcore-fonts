name: Build DEB/RPM and update rolling release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DEB and RPM
        run: |
          sudo bash build.sh rpm deb

      - name: Verify RPM fonts on Fedora 45
        timeout-minutes: 10
        run: |
          docker run --rm -i -v "$PWD/dist/rpmbuild/RPMS/noarch:/rpms:ro" \
            registry.fedoraproject.org/fedora:45 bash -e <<'BASH'
          dnf -y install /rpms/msttcore-fonts-installer-*.noarch.rpm
          for family in 'Times New Roman' Arial Calibri; do
            match=$(fc-match -f '%{family[0]}: %{file}' "$family")
            echo "Checking $family -> $match"
            [[ $match == "$family: /usr/share/fonts/msttcore/"* ]] || exit 1
          done
          BASH

      - name: Move rolling release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa fonts -m "Rolling release for ${GITHUB_SHA}" "${GITHUB_SHA}"
          git push origin refs/tags/fonts --force

      - name: Update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fonts
          name: "msttcore-fonts packages"
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/debbuild/ttf-mscorefonts-installer_*.deb
            dist/rpmbuild/RPMS/noarch/msttcore-fonts-installer-*.noarch.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
